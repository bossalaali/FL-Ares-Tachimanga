name: Build ARESManga extension

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout this repo (main)
        uses: actions/checkout@v4
        with:
          path: me

      - name: Checkout keiyoushi extensions-source
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          path: kei

      - name: Checkout repo branch (if it exists)
        run: |
          set -e
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" repo >/dev/null 2>&1; then
            git clone --depth 1 --branch repo "$url" out
          else
            mkdir out && cd out && git init -b repo && git remote add origin "$url"
          fi

      - name: Add ARESManga extension, drop all other extensions
        run: |
          set -e
          cd kei
          find src -mindepth 1 -maxdepth 1 -type d ! -name ar -exec rm -rf {} +
          find src/ar -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          if [ -d ../me/aresmanga ]; then
            cp -r ../me/aresmanga src/ar/aresmanga
          else
            mkdir -p src/ar/aresmanga/src/eu/kanade/tachiyomi/extension/ar/aresmanga
            cat > src/ar/aresmanga/build.gradle.kts <<'EOF'
          import io.github.keiyoushi.gradle.api.ContentWarning

          plugins {
              alias(kei.plugins.extension)
          }

          keiyoushi {
              name = "ARESManga"
              versionCode = 1
              contentWarning = ContentWarning.SAFE
              libVersion = "1.6"
              theme = "mangathemesia"

              source {
                  name = "أريس مانجا"
                  lang = "ar"
                  baseUrl = "https://fl-ares.com"
              }
          }
          EOF
            cat > src/ar/aresmanga/src/eu/kanade/tachiyomi/extension/ar/aresmanga/AresManga.kt <<'EOF'
          package eu.kanade.tachiyomi.extension.ar.aresmanga

          import eu.kanade.tachiyomi.multisrc.mangathemesia.MangaThemesia
          import keiyoushi.annotation.Source

          @Source
          abstract class AresManga : MangaThemesia() {
              override val mangaUrlDirectory = "/series"
          }
          EOF
          fi
          find src -type f

      - name: Prepare signing key (kept stable in the repo branch)
        run: |
          set -e
          mkdir -p out/key
          if [ ! -f out/key/signingkey.jks ]; then
            keytool -genkeypair -v -keystore out/key/signingkey.jks -alias ext \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass extpass -keypass extpass \
              -dname "CN=Personal Extensions"
          fi
          cp out/key/signingkey.jks kei/signingkey.jks

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        env:
          ALIAS: ext
          KEY_STORE_PASSWORD: extpass
          KEY_PASSWORD: extpass
        run: |
          cd kei
          ./gradlew :src:ar:aresmanga:assembleRelease

      - name: Write repo (index.pb, index.json, index.min.json)
        env:
          REPO: ${{ github.repository }}
        run: |
          set -e
          python -m pip install --user --quiet protobuf
          FP=$(keytool -exportcert -rfc -keystore out/key/signingkey.jks -alias ext -storepass extpass \
               | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          export FP
          cd out
          rm -rf apk jar
          mkdir -p apk jar
          cp ../kei/src/ar/aresmanga/build/outputs/apk/release/*.apk apk/
          cp ../kei/src/ar/aresmanga/build/outputs/jar/release/*.jar jar/
          cp ../kei/src/ar/aresmanga/build/keiyoushi-source-info.json .
          PYTHONPATH=../kei/.github/scripts python - <<'EOF'
          import gzip, json, os
          from pathlib import Path
          import index_pb2
          from google.protobuf import json_format

          repo = os.environ["REPO"]
          raw = f"https://raw.githubusercontent.com/{repo}/repo"
          info = json.load(open("keiyoushi-source-info.json", encoding="utf-8"))
          apk = next(Path("apk").glob("*.apk")).name
          jar = next(Path("jar").glob("*.jar")).name
          icon = "https://cdn.jsdelivr.net/gh/keiyoushi/extensions-source@main/lib-multisrc/mangathemesia/res/mipmap-xhdpi/ic_launcher.png"

          ext = index_pb2.Extension(
              name=info["name"],
              packageName=info["packageName"],
              resources=index_pb2.Resources(apkUrl=f"{raw}/apk/{apk}", jarUrl=f"{raw}/jar/{jar}", iconUrl=icon),
              extensionLib=info["extensionLib"],
              versionCode=info["versionCode"],
              versionName=info["versionName"],
              contentWarning=info["contentWarning"],
              sources=[index_pb2.Source(id=int(s["id"]), name=s["name"], language=s["lang"],
                                        homeUrl=s["baseUrl"], mirrorUrls=s.get("mirrorUrls", []))
                       for s in info["sources"]],
          )
          index = index_pb2.Index(
              name="My Extensions", badgeLabel="ME", signingKey=os.environ["FP"],
              contact=index_pb2.Contact(website=f"https://github.com/{repo}"),
              extensionList=index_pb2.ExtensionList(extensions=[ext]),
          )
          Path("index.json").write_text(json_format.MessageToJson(index, preserving_proto_field_name=True), encoding="utf-8")
          Path("index.pb").write_bytes(gzip.compress(index.SerializeToString(deterministic=True), mtime=0))

          nsfw = 1 if info["contentWarning"] == "CONTENT_WARNING_NSFW" else 0
          legacy = [{
              "name": "Tachiyomi: " + info["name"], "pkg": info["packageName"], "apk": apk,
              "lang": "ar", "code": info["versionCode"], "version": info["versionName"], "nsfw": nsfw,
              "sources": [{"name": s["name"], "lang": s["lang"], "id": str(s["id"]), "baseUrl": s["baseUrl"]}
                          for s in info["sources"]],
          }]
          Path("index.min.json").write_text(json.dumps(legacy, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          Path("repo.json").write_text(json.dumps({"meta": {"name": "My Extensions", "signingKeyFingerprint": os.environ["FP"]}}), encoding="utf-8")
          print(Path("index.json").read_text(encoding="utf-8"))
          EOF
          rm keiyoushi-source-info.json

      - name: Push repo branch
        run: |
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update extension repo"
          git push origin repo
