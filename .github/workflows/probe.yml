name: Probe site
on:
  workflow_dispatch:
    inputs:
      paths:
        description: space separated paths
        default: ""
      script:
        description: python script in tools/ to run
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: me
      - name: Run script
        if: ${{ inputs.script != '' }}
        env:
          SCRIPT: ${{ inputs.script }}
        run: python3 "me/tools/$SCRIPT" | tee script-output.txt
      - name: Fetch pages
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          mkdir p && cd p
          [ -f ../script-output.txt ] && cp ../script-output.txt . && cat script-output.txt >> index.txt
          for u in $PATHS; do
            case "$u" in http*) url="$u";; *) url="https://fl-ares.com$u";; esac
            f=$(echo "$u" | tr -c 'a-zA-Z0-9' '_' | cut -c1-120).html
            code=$(curl -sSL -A "$UA" -o "$f" -w "%{http_code} %{content_type}" "$url")
            echo "== $u -> $code size=$(wc -c <"$f")" | tee -a index.txt
          done
          git init -q -b probe && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
